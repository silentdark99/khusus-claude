<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Jadwal Harian</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Jadwal Harian</h1>

  <div class="input-row">
    <input type="text" id="taskName" placeholder="Nama kegiatan">
    <input type="time" id="taskStart">
    <input type="number" id="taskDuration" placeholder="Durasi (menit)" min="1">
    <button id="addButton">Tambah</button>
  </div>

  <ul id="scheduleList"></ul>

  <script src="script.js"></script>
</body>
</html>
